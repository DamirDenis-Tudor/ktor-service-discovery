name: Deployment

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Select version type:'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  next-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Get next version
        uses: reecetech/version-increment@2024.10.1
        id: version
        with:
          scheme: semver
          increment: ${{ github.event.inputs.version_type }}
    outputs:
      version: ${{ steps.version.outputs.version }}

  maven-deploy:
    runs-on: ubuntu-latest
    needs: next-version
    strategy:
      matrix:
        subproject: [ ktor-service-registry, ktor-service-discoverable, ktor-service-discoverer ]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare ${{ matrix.subproject }} for publish
        run: |
          ./gradlew ${{ matrix.subproject }}:publish \
            -PreleaseVersion="${{ needs.next-version.outputs.version }}" \
            -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}" \
            -Psigning.password="${{ secrets.SIGNING_PASSWORD }}" \
            -Psigning.secretKeyRingFile="${{ secrets.SIGNING_SECRET_KEY_RING_FILE }}"

      - name: Deploy ${{ matrix.subproject }} in Maven Central
        run: |
          ./gradlew ${{ matrix.subproject }}:jreleaserDeploy \
            -PreleaseVersion="${{ needs.next-version.outputs.version }}" \
            -PmavenCentralUsername="${{ secrets.MAVEN_CENTRAL_USERNAME }}" \
            -PmavenCentralPasswordToken="${{ secrets.MAVEN_CENTRAL_PASSWORD_TOKEN }}"

  github-release:
    runs-on: ubuntu-latest
    needs:
      - next-version
      - maven-deploy
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Update
        run: |
          ./gradlew jreleaserRelease \
              -PreleaseVersion="${{ needs.next-version.outputs.version }}" \
              -PgithubToken="${{ secrets.GITHUB_TOKEN }}"
